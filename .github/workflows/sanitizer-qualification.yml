name: Extended sanitizer qualification

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  linux-sanitizers:
    name: Linux ASan and UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the shared Linux environment
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/linux/Dockerfile
          load: true
          tags: ggpo-linux-ci:sanitizers
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Instrument production GGPO and run all tests
        run: |
          python3 scripts/linux/build_in_container.py \
            --skip-image-build \
            --image ggpo-linux-ci:sanitizers \
            --compiler clang \
            --library static \
            --sanitizers \
            --out build/linux-sanitizers
      - name: Upload sanitizer test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-clang-asan-ubsan
          path: build/linux-sanitizers/build/Testing
          if-no-files-found: error

  windows-asan:
    # Replaces the memory checking the dropped Windows Debug lanes provided.
    name: Windows MSVC AddressSanitizer (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Instrument production GGPO and run all tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          # Static GGPO (no DLL boundary) built Release with /fsanitize=address.
          # CMAKE_*_FLAGS replace CMake's MSVC defaults, so restate them.
          $flags = "/DWIN32 /D_WINDOWS /EHsc /GR /fsanitize=address /Zi"
          cmake -S . -B build/windows-asan -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_SHARED_LIBS=OFF `
            -DGGPO_BUILD_VECTORWAR=ON `
            -DGGPO_RUN_TESTS_ON_BUILD=OFF `
            -DBUILD_TESTING=ON `
            "-DCMAKE_C_FLAGS=$flags" `
            "-DCMAKE_CXX_FLAGS=$flags"
          cmake --build build/windows-asan --config Release --parallel

          # /MD binaries load the ASan runtime DLL from the MSVC toolset.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $runtime = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find "VC\Tools\MSVC\**\bin\Hostx64\x64\clang_rt.asan_dynamic-x86_64.dll" |
            Select-Object -Last 1
          if (!$runtime) { throw "MSVC AddressSanitizer runtime not found" }
          $env:PATH = "$(Split-Path $runtime);$env:PATH"
          $env:ASAN_OPTIONS = "halt_on_error=1:detect_stack_use_after_return=1"
          ctest --test-dir build/windows-asan -C Release --output-on-failure
      - name: Upload sanitizer test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-asan
          path: build/windows-asan/Testing
          if-no-files-found: warn

  android-asan:
    # Android ASan+UBSan in an x86_64 emulator (hosted arm64 runners have no
    # KVM). The sanitizer runtime and libc++_shared.so sit beside the tests so
    # tests/android/run_on_device.py pushes them with each executable.
    name: Android ASan and UBSan (x86_64 emulator)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrument static GGPO and the tests
        run: |
          ndk="$ANDROID_NDK_LATEST_HOME"
          flags="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake -S . -B build/asan -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=27 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGPO_BUILD_VECTORWAR=OFF -DBUILD_TESTING=ON \
            "-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags" \
            "-DCMAKE_EXE_LINKER_FLAGS=$flags" \
            "-DCMAKE_CROSSCOMPILING_EMULATOR=python3;$GITHUB_WORKSPACE/tests/android/run_on_device.py"
          cmake --build build/asan --parallel 4
          bin=$(echo build/asan/bin/*/Release)
          clang="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          cp "$("$clang" --target=x86_64-linux-android27 -print-file-name=libclang_rt.asan-x86_64-android.so)" "$bin/"
          cp "$ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so" "$bin/"
          ls "$bin"/*.so
      - name: Run the instrumented suite in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GGPO_TEST_LAUNCHER: ${{ github.workspace }}/tests/android/run_on_device.py
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: ctest --test-dir build/asan --output-on-failure --timeout 300
      - name: Upload sanitizer test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-asan-ubsan
          path: build/asan/Testing
          if-no-files-found: warn
