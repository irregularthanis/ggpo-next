name: Windows M0 baseline

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  baseline:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, Win32]
        shared: [ON, OFF]
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Configure, build, test, and capture M0
        shell: pwsh
        run: |
          $noiseRuns = 0
          if ("${{ matrix.architecture }}" -eq "x64" -and
              "${{ matrix.shared }}" -eq "ON" -and
              "${{ matrix.configuration }}" -eq "Release") {
            $noiseRuns = 10
          }
          ./scripts/ci/windows_m0.ps1 `
            -Architecture "${{ matrix.architecture }}" `
            -Shared "${{ matrix.shared }}" `
            -Configuration "${{ matrix.configuration }}" `
            -Generator "Visual Studio 17 2022" `
            -BuildDirectory "build/m0" `
            -EvidenceDirectory "build/m0-evidence" `
            -NoiseRuns $noiseRuns

      - name: Upload M0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-${{ matrix.architecture }}-${{ matrix.shared }}-${{ matrix.configuration }}
          path: build/m0-evidence
          if-no-files-found: error
