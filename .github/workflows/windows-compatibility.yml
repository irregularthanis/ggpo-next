name: Windows compatibility baseline

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request supersedes this run, so cancel it and
# free the runners. Runs on master pushes and manual dispatches always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/classify-changes.yml
    with:
      base: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      force: ${{ github.event_name == 'workflow_dispatch' }}

  baseline:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Windows compatibility (${{ matrix.architecture }}, ${{ matrix.label }}, ${{ matrix.configuration }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        # Release lanes build GGPO.dll and libGGPO.lib together and test both.
        # One Debug lane keeps the MSVC debug runtime checks (/RTC1, debug heap,
        # checked iterators); the other Debug variants compiled the same
        # sources and added no coverage.
        include:
          - {architecture: x64, shared: BOTH, label: both, configuration: Release}
          - {architecture: Win32, shared: BOTH, label: both, configuration: Release}
          - {architecture: x64, shared: BOTH, label: both, configuration: Debug}

    steps:
      - uses: actions/checkout@v4

      - name: Build and test the Windows compatibility baseline
        shell: pwsh
        run: |
          ./scripts/ci/windows_compatibility_baseline.ps1 `
            -Architecture "${{ matrix.architecture }}" `
            -Shared "${{ matrix.shared }}" `
            -Configuration "${{ matrix.configuration }}" `
            -Generator "Visual Studio 17 2022" `
            -BuildDirectory "build/windows-compatibility" `
            -EvidenceDirectory "build/windows-compatibility-evidence"

      - name: Upload Windows compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-compatibility-${{ matrix.architecture }}-${{ matrix.label }}-${{ matrix.configuration }}
          path: build/windows-compatibility-evidence
          if-no-files-found: error

  final-compatibility:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Frozen Windows baseline / candidate compatibility
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 34988996cab45c1a37a9c556fe66b192d60a547b
          path: windows-baseline
      - name: Compare frozen Windows baseline and candidate contracts
        shell: pwsh
        run: |
          ./scripts/ci/verify_windows_compatibility.ps1 `
            -BaselineSource "windows-baseline" `
            -Generator "Visual Studio 17 2022" `
            -BuildRoot "build/windows-final-qualification" `
            -EvidenceRoot "build/windows-final-evidence"
      - name: Upload final compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-final-compatibility
          path: build/windows-final-evidence
          if-no-files-found: error

  portable-header:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Portable public header (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Compile C11 and C++98 consumers without linking an SDK
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = gcc ]; then
            cc=gcc
            cxx=g++
            cxx_extra=()
          else
            cc=clang
            cxx=clang++
            # C needs a byte in GGPOPlayer.local because it forbids empty
            # structs; C++ retains the frozen empty-member ABI.
            cxx_extra=(-Wno-extern-c-compat)
          fi
          "$cc" -std=c11 -pedantic-errors -Werror -Isrc/include \
            -c tests/consumer/consumer.c -o /tmp/ggpo-consumer-c.o
          "$cxx" -std=c++98 -pedantic-errors -Werror "${cxx_extra[@]}" -Isrc/include \
            -c tests/consumer/consumer.cpp -o /tmp/ggpo-consumer-cpp.o

  final-report:
    # One stable required check. Matrix lanes skipped on documentation-only
    # changes never report their expanded names, so the ruleset requires this
    # aggregate instead of the individual lanes.
    name: Complete Windows compatibility
    if: always()
    needs: [changes, baseline, final-compatibility, portable-header]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Windows qualification lane
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          BASELINE: ${{ needs.baseline.result }}
          FINAL_COMPATIBILITY: ${{ needs.final-compatibility.result }}
          PORTABLE_HEADER: ${{ needs.portable-header.result }}
        run: |
          # A failed classifier must not look like a documentation-only change.
          test "$CHANGES" = success
          if test "$CODE_CHANGED" != true; then
            echo "Documentation-only change: Windows qualification is not required."
            exit 0
          fi
          test "$BASELINE" = success
          test "$FINAL_COMPATIBILITY" = success
          test "$PORTABLE_HEADER" = success
