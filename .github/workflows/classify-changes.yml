name: Classify changes

on:
  workflow_call:
    inputs:
      base:
        type: string
        required: false
        default: ""
      force:
        type: boolean
        required: false
        default: false
      area:
        # The calling workflow's area (see .github/ci/affected_areas.py).
        # Empty keeps the old meaning: any non-documentation change.
        type: string
        required: false
        default: ""
    outputs:
      code:
        value: ${{ jobs.classify.outputs.code }}

jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect whether this workflow's area changed
        id: changes
        shell: bash
        env:
          BASE: ${{ inputs.base }}
          FORCE: ${{ inputs.force }}
          AREA: ${{ inputs.area }}
          # Only pull requests are narrowed; master pushes run everything, so
          # a wrong rule can never let a broken platform reach master unseen.
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$FORCE" = true || -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$AREA" && "$EVENT" = pull_request ]]; then
            code=$(python3 .github/ci/affected_areas.py --area "$AREA" --base "$BASE" --head "$GITHUB_SHA")
            echo "Area $AREA affected: $code"
            echo "code=$code" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r path; do
            case "$path" in
              doc/*|docs/*|*.md) ;;
              *) code=true; break ;;
            esac
          done < <(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "code=$code" >> "$GITHUB_OUTPUT"
