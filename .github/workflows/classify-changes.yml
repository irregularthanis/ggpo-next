name: Classify changes

on:
  workflow_call:
    inputs:
      base:
        type: string
        required: false
        default: ""
      force:
        type: boolean
        required: false
        default: false
    outputs:
      code:
        value: ${{ jobs.classify.outputs.code }}

jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect non-documentation changes
        id: changes
        shell: bash
        env:
          BASE: ${{ inputs.base }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [[ "$FORCE" = true || -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r path; do
            case "$path" in
              doc/*|docs/*|*.md) ;;
              *) code=true; break ;;
            esac
          done < <(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "code=$code" >> "$GITHUB_OUTPUT"
