name: Native cross-platform E2E

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to the same pull request supersedes this run, so cancel it and
# free the runners. Runs on master pushes and manual dispatches always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  deployments: write

jobs:
  changes:
    uses: ./.github/workflows/classify-changes.yml
    with:
      base: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      force: ${{ github.event_name == 'workflow_dispatch' }}

  build-linux:
    needs: changes
    name: Build native Linux peer
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == github.repository_owner))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the Release x64 static fixtures
        run: |
          cmake -S . -B build/e2e -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGPO_BUILD_VECTORWAR_GUI=OFF
          cmake --build build/e2e \
            --target ggpo_linux_peer_smoke VectorWarHeadless --parallel 2
          install -D -m 0755 build/e2e/bin/x64/Release/ggpo_linux_peer_smoke \
            build/evidence/peer/ggpo_peer_smoke
          install -D -m 0755 build/e2e/bin/x64/Release/VectorWarHeadless \
            build/evidence/peer/vectorwar_headless
          sha256sum build/evidence/peer/ggpo_peer_smoke \
            build/evidence/peer/vectorwar_headless \
            > build/evidence/peer/sha256.txt
          cmake --version > build/evidence/peer/toolchain.txt
          c++ --version >> build/evidence/peer/toolchain.txt
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-peer-linux
          path: build/evidence/peer
          if-no-files-found: error

  build-windows:
    needs: changes
    name: Build native Windows peer
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == github.repository_owner))
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build the Release x64 static fixtures
        shell: pwsh
        run: |
          cmake -S . -B build/e2e -A x64 -DBUILD_SHARED_LIBS=OFF
          cmake --build build/e2e --config Release `
            --target ggpo_windows_peer_smoke VectorWarHeadless --parallel 2
          New-Item -ItemType Directory -Force build/evidence/peer | Out-Null
          Copy-Item build/e2e/bin/x64/Release/ggpo_windows_peer_smoke.exe `
            build/evidence/peer/ggpo_peer_smoke.exe
          Copy-Item build/e2e/bin/x64/Release/VectorWarHeadless.exe `
            build/evidence/peer/vectorwar_headless.exe
          Get-FileHash build/evidence/peer/ggpo_peer_smoke.exe, `
            build/evidence/peer/vectorwar_headless.exe -Algorithm SHA256 `
            | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path)" } `
            | Set-Content build/evidence/peer/sha256.txt
          cmake --version | Set-Content build/evidence/peer/toolchain.txt
          Get-Content build/e2e/CMakeCache.txt `
            | Select-String '^(CMAKE_(C|CXX)_COMPILER|CMAKE_GENERATOR|CMAKE_VS_PLATFORM_NAME):' `
            | Add-Content build/evidence/peer/toolchain.txt
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-peer-windows
          path: build/evidence/peer
          if-no-files-found: error

  build-mingw:
    needs: changes
    name: Build native MinGW peer
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == github.repository_owner))
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Build the Release x64 static MinGW peer
        run: |
          # -static: the role job runs on a plain Windows runner without the
          # MinGW runtime DLLs on PATH.
          cmake -S . -B build/e2e -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build build/e2e --target ggpo_windows_peer_smoke --parallel 2
          mkdir -p build/evidence/peer
          cp build/e2e/bin/x64/Release/ggpo_windows_peer_smoke.exe \
            build/evidence/peer/ggpo_peer_smoke.exe
          objdump -p build/evidence/peer/ggpo_peer_smoke.exe | grep 'DLL Name'
          sha256sum build/evidence/peer/ggpo_peer_smoke.exe \
            > build/evidence/peer/sha256.txt
          cmake --version > build/evidence/peer/toolchain.txt
          gcc --version >> build/evidence/peer/toolchain.txt
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-peer-mingw
          path: build/evidence/peer
          if-no-files-found: error

  build-android:
    needs: changes
    name: Build native Android peer
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == github.repository_owner))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the Release arm64-v8a static Android peers
        run: |
          # -static: bionic linked in, so the peers run natively on the
          # ubuntu-24.04-arm role runners.
          cmake -S . -B build/e2e -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=21 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGPO_BUILD_VECTORWAR=ON -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build build/e2e --target ggpo_android_peer_smoke VectorWarHeadless --parallel 2
          install -D -m 0755 build/e2e/bin/*/Release/ggpo_android_peer_smoke \
            build/evidence/peer/ggpo_peer_smoke
          install -D -m 0755 build/e2e/bin/*/Release/VectorWarHeadless \
            build/evidence/peer/vectorwar_headless
          file build/evidence/peer/*
          sha256sum build/evidence/peer/ggpo_peer_smoke build/evidence/peer/vectorwar_headless \
            > build/evidence/peer/sha256.txt
          cat "$ANDROID_NDK_LATEST_HOME/source.properties" > build/evidence/peer/toolchain.txt
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-peer-android
          path: build/evidence/peer
          if-no-files-found: error

  execute:
    name: ${{ matrix.fixture }} / ${{ matrix.scenario }} / role ${{ matrix.role }}
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == github.repository_owner))
    needs: [changes, build-linux, build-windows, build-mingw, build-android]
    runs-on: ${{ matrix.os }}
    # Role jobs are scheduled independently across three runner pools. Keep a
    # bounded window for queue skew, but fail a missing pair promptly.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {fixture: smoke, scenario: linux-linux, role: 1, platform: linux, os: ubuntu-24.04, player1: linux, player2: linux, executable: peer/ggpo_peer_smoke, player1_executable: peer/ggpo_peer_smoke}
          - {fixture: smoke, scenario: linux-linux, role: 2, platform: linux, os: ubuntu-24.04, player1: linux, player2: linux, executable: peer/ggpo_peer_smoke, player1_executable: peer/ggpo_peer_smoke}
          - {fixture: smoke, scenario: windows-windows, role: 1, platform: windows, os: windows-2022, player1: windows, player2: windows, executable: peer/ggpo_peer_smoke.exe, player1_executable: peer/ggpo_peer_smoke.exe}
          - {fixture: smoke, scenario: windows-windows, role: 2, platform: windows, os: windows-2022, player1: windows, player2: windows, executable: peer/ggpo_peer_smoke.exe, player1_executable: peer/ggpo_peer_smoke.exe}
          - {fixture: smoke, scenario: linux-windows, role: 1, platform: linux, os: ubuntu-24.04, player1: linux, player2: windows, executable: peer/ggpo_peer_smoke, player1_executable: peer/ggpo_peer_smoke}
          - {fixture: smoke, scenario: linux-windows, role: 2, platform: windows, os: windows-2022, player1: linux, player2: windows, executable: peer/ggpo_peer_smoke.exe, player1_executable: peer/ggpo_peer_smoke}
          - {fixture: smoke, scenario: windows-linux, role: 1, platform: windows, os: windows-2022, player1: windows, player2: linux, executable: peer/ggpo_peer_smoke.exe, player1_executable: peer/ggpo_peer_smoke.exe}
          - {fixture: smoke, scenario: windows-linux, role: 2, platform: linux, os: ubuntu-24.04, player1: windows, player2: linux, executable: peer/ggpo_peer_smoke, player1_executable: peer/ggpo_peer_smoke.exe}
          # Android (NDK arm64 static peers, run natively on the arm64 runner) against
          # every platform, both fixtures, both player orders.
          - {fixture: smoke, scenario: android-android, role: 1, platform: android, os: ubuntu-24.04-arm, player1: android, player2: android, executable: peer/ggpo_peer_smoke, player1_executable: peer/ggpo_peer_smoke}
          - {fixture: smoke, scenario: android-android, role: 2, platform: android, os: ubuntu-24.04-arm, player1: android, player2: android, executable: peer/ggpo_peer_smoke, player1_executable: peer/ggpo_peer_smoke}
          - {fixture: smoke, scenario: android-linux, role: 1, platform: android, os: ubuntu-24.04-arm, player1: android, player2: linux, executable: peer/ggpo_peer_smoke, player1_executable: peer/ggpo_peer_smoke}
          - {fixture: smoke, scenario: android-linux, role: 2, platform: linux, os: ubuntu-24.04, player1: android, player2: linux, executable: peer/ggpo_peer_smoke, player1_executable: peer/ggpo_peer_smoke}
          - {fixture: smoke, scenario: linux-android, role: 1, platform: linux, os: ubuntu-24.04, player1: linux, player2: android, executable: peer/ggpo_peer_smoke, player1_executable: peer/ggpo_peer_smoke}
          - {fixture: smoke, scenario: linux-android, role: 2, platform: android, os: ubuntu-24.04-arm, player1: linux, player2: android, executable: peer/ggpo_peer_smoke, player1_executable: peer/ggpo_peer_smoke}
          - {fixture: smoke, scenario: android-windows, role: 1, platform: android, os: ubuntu-24.04-arm, player1: android, player2: windows, executable: peer/ggpo_peer_smoke, player1_executable: peer/ggpo_peer_smoke}
          - {fixture: smoke, scenario: android-windows, role: 2, platform: windows, os: windows-2022, player1: android, player2: windows, executable: peer/ggpo_peer_smoke.exe, player1_executable: peer/ggpo_peer_smoke}
          - {fixture: smoke, scenario: windows-android, role: 1, platform: windows, os: windows-2022, player1: windows, player2: android, executable: peer/ggpo_peer_smoke.exe, player1_executable: peer/ggpo_peer_smoke.exe}
          - {fixture: smoke, scenario: windows-android, role: 2, platform: android, os: ubuntu-24.04-arm, player1: windows, player2: android, executable: peer/ggpo_peer_smoke, player1_executable: peer/ggpo_peer_smoke.exe}
          - {fixture: smoke, scenario: android-mingw, role: 1, platform: android, os: ubuntu-24.04-arm, player1: android, player2: mingw, executable: peer/ggpo_peer_smoke, player1_executable: peer/ggpo_peer_smoke}
          - {fixture: smoke, scenario: android-mingw, role: 2, platform: mingw, os: windows-2022, player1: android, player2: mingw, executable: peer/ggpo_peer_smoke.exe, player1_executable: peer/ggpo_peer_smoke}
          - {fixture: smoke, scenario: mingw-android, role: 1, platform: mingw, os: windows-2022, player1: mingw, player2: android, executable: peer/ggpo_peer_smoke.exe, player1_executable: peer/ggpo_peer_smoke.exe}
          - {fixture: smoke, scenario: mingw-android, role: 2, platform: android, os: ubuntu-24.04-arm, player1: mingw, player2: android, executable: peer/ggpo_peer_smoke, player1_executable: peer/ggpo_peer_smoke.exe}
          - {fixture: vectorwar, scenario: vectorwar-android-android, role: 1, platform: android, os: ubuntu-24.04-arm, player1: android, player2: android, executable: peer/vectorwar_headless, player1_executable: peer/vectorwar_headless}
          - {fixture: vectorwar, scenario: vectorwar-android-android, role: 2, platform: android, os: ubuntu-24.04-arm, player1: android, player2: android, executable: peer/vectorwar_headless, player1_executable: peer/vectorwar_headless}
          - {fixture: vectorwar, scenario: vectorwar-android-linux, role: 1, platform: android, os: ubuntu-24.04-arm, player1: android, player2: linux, executable: peer/vectorwar_headless, player1_executable: peer/vectorwar_headless}
          - {fixture: vectorwar, scenario: vectorwar-android-linux, role: 2, platform: linux, os: ubuntu-24.04, player1: android, player2: linux, executable: peer/vectorwar_headless, player1_executable: peer/vectorwar_headless}
          - {fixture: vectorwar, scenario: vectorwar-linux-android, role: 1, platform: linux, os: ubuntu-24.04, player1: linux, player2: android, executable: peer/vectorwar_headless, player1_executable: peer/vectorwar_headless}
          - {fixture: vectorwar, scenario: vectorwar-linux-android, role: 2, platform: android, os: ubuntu-24.04-arm, player1: linux, player2: android, executable: peer/vectorwar_headless, player1_executable: peer/vectorwar_headless}
          - {fixture: vectorwar, scenario: vectorwar-android-windows, role: 1, platform: android, os: ubuntu-24.04-arm, player1: android, player2: windows, executable: peer/vectorwar_headless, player1_executable: peer/vectorwar_headless}
          - {fixture: vectorwar, scenario: vectorwar-android-windows, role: 2, platform: windows, os: windows-2022, player1: android, player2: windows, executable: peer/vectorwar_headless.exe, player1_executable: peer/vectorwar_headless}
          - {fixture: vectorwar, scenario: vectorwar-windows-android, role: 1, platform: windows, os: windows-2022, player1: windows, player2: android, executable: peer/vectorwar_headless.exe, player1_executable: peer/vectorwar_headless.exe}
          - {fixture: vectorwar, scenario: vectorwar-windows-android, role: 2, platform: android, os: ubuntu-24.04-arm, player1: windows, player2: android, executable: peer/vectorwar_headless, player1_executable: peer/vectorwar_headless.exe}
          # MinGW player 1 against MSVC Windows and Linux player 2.
          - {fixture: smoke, scenario: mingw-windows, role: 1, platform: mingw, os: windows-2022, player1: mingw, player2: windows, executable: peer/ggpo_peer_smoke.exe, player1_executable: peer/ggpo_peer_smoke.exe}
          - {fixture: smoke, scenario: mingw-windows, role: 2, platform: windows, os: windows-2022, player1: mingw, player2: windows, executable: peer/ggpo_peer_smoke.exe, player1_executable: peer/ggpo_peer_smoke.exe}
          - {fixture: smoke, scenario: mingw-linux, role: 1, platform: mingw, os: windows-2022, player1: mingw, player2: linux, executable: peer/ggpo_peer_smoke.exe, player1_executable: peer/ggpo_peer_smoke.exe}
          - {fixture: smoke, scenario: mingw-linux, role: 2, platform: linux, os: ubuntu-24.04, player1: mingw, player2: linux, executable: peer/ggpo_peer_smoke, player1_executable: peer/ggpo_peer_smoke.exe}
          - {fixture: vectorwar, scenario: vectorwar-linux-linux, role: 1, platform: linux, os: ubuntu-24.04, player1: linux, player2: linux, executable: peer/vectorwar_headless, player1_executable: peer/vectorwar_headless}
          - {fixture: vectorwar, scenario: vectorwar-linux-linux, role: 2, platform: linux, os: ubuntu-24.04, player1: linux, player2: linux, executable: peer/vectorwar_headless, player1_executable: peer/vectorwar_headless}
          - {fixture: vectorwar, scenario: vectorwar-windows-windows, role: 1, platform: windows, os: windows-2022, player1: windows, player2: windows, executable: peer/vectorwar_headless.exe, player1_executable: peer/vectorwar_headless.exe}
          - {fixture: vectorwar, scenario: vectorwar-windows-windows, role: 2, platform: windows, os: windows-2022, player1: windows, player2: windows, executable: peer/vectorwar_headless.exe, player1_executable: peer/vectorwar_headless.exe}
          - {fixture: vectorwar, scenario: vectorwar-linux-windows, role: 1, platform: linux, os: ubuntu-24.04, player1: linux, player2: windows, executable: peer/vectorwar_headless, player1_executable: peer/vectorwar_headless}
          - {fixture: vectorwar, scenario: vectorwar-linux-windows, role: 2, platform: windows, os: windows-2022, player1: linux, player2: windows, executable: peer/vectorwar_headless.exe, player1_executable: peer/vectorwar_headless}
          - {fixture: vectorwar, scenario: vectorwar-windows-linux, role: 1, platform: windows, os: windows-2022, player1: windows, player2: linux, executable: peer/vectorwar_headless.exe, player1_executable: peer/vectorwar_headless.exe}
          - {fixture: vectorwar, scenario: vectorwar-windows-linux, role: 2, platform: linux, os: ubuntu-24.04, player1: windows, player2: linux, executable: peer/vectorwar_headless, player1_executable: peer/vectorwar_headless.exe}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: e2e-peer-${{ matrix.platform }}
          path: peer
      - name: Make the Linux peer executable
        if: runner.os == 'Linux'
        run: chmod 0755 peer/ggpo_peer_smoke peer/vectorwar_headless
      - name: Join the ephemeral E2E tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ggpo-ci
      - name: Record the Tailscale IPv4 address
        id: address
        shell: bash
        run: echo "ipv4=$(tailscale ip -4 | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Allow the bounded E2E ports on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-NetFirewallRule -DisplayName "GGPO E2E $env:GITHUB_RUN_ID ${{ matrix.scenario }}" `
            -Direction Inbound -Action Allow -Protocol TCP -LocalPort 24871
          New-NetFirewallRule -DisplayName "GGPO E2E UDP $env:GITHUB_RUN_ID ${{ matrix.scenario }}" `
            -Direction Inbound -Action Allow -Protocol UDP -LocalPort 24872-24873
      - name: Serve player 1
        if: matrix.role == 1
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GGPO_E2E_SESSION_SECRET: ${{ secrets.GGPO_E2E_SESSION_SECRET }}
        run: |
          python tests/e2e/host_agent.py \
            --workspace "$GITHUB_WORKSPACE" \
            --address "${{ steps.address.outputs.ipv4 }}" \
            --session-id "${{ matrix.scenario }}" --timeout 600
      - name: Coordinate player 2 and validate the session
        if: matrix.role == 2
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GGPO_E2E_SESSION_SECRET: ${{ secrets.GGPO_E2E_SESSION_SECRET }}
        run: |
          python tests/e2e/execute_pair.py \
            --workspace "$GITHUB_WORKSPACE" \
            --executable "${{ matrix.executable }}" \
            --player1-executable "${{ matrix.player1_executable }}" \
            --local-address "${{ steps.address.outputs.ipv4 }}" \
            --session-id "${{ matrix.scenario }}" \
            --rendezvous-timeout 600 \
            --scenario "${{ matrix.scenario }}" \
            --fixture "${{ matrix.fixture }}" \
            --player1-platform "${{ matrix.player1 }}" \
            --player2-platform "${{ matrix.player2 }}" \
            --out "evidence/report.json"
      - name: Remove Windows firewall rules
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-NetFirewallRule -DisplayName "GGPO E2E $env:GITHUB_RUN_ID ${{ matrix.scenario }}" `
            -ErrorAction SilentlyContinue
          Remove-NetFirewallRule -DisplayName "GGPO E2E UDP $env:GITHUB_RUN_ID ${{ matrix.scenario }}" `
            -ErrorAction SilentlyContinue
      - name: Upload role evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.scenario }}-role${{ matrix.role }}
          path: evidence
          if-no-files-found: warn

  final-report:
    name: Complete native E2E matrix
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == github.repository_owner))
    needs: [changes, build-linux, build-windows, build-mingw, build-android, execute]
    runs-on: ubuntu-24.04
    steps:
      - name: Require a successful change classifier
        # A failed classifier must not look like a documentation-only change.
        env:
          CHANGES: ${{ needs.changes.result }}
        run: test "$CHANGES" = success
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.code == 'true'
        with:
          pattern: e2e-*-role2
          path: evidence
      - name: Reject failed jobs or incomplete scenarios
        if: needs.changes.outputs.code == 'true'
        env:
          BUILD_LINUX: ${{ needs.build-linux.result }}
          BUILD_WINDOWS: ${{ needs.build-windows.result }}
          BUILD_MINGW: ${{ needs.build-mingw.result }}
          BUILD_ANDROID: ${{ needs.build-android.result }}
          EXECUTE: ${{ needs.execute.result }}
        run: |
          test "$BUILD_LINUX" = success
          test "$BUILD_WINDOWS" = success
          test "$BUILD_MINGW" = success
          test "$BUILD_ANDROID" = success
          test "$EXECUTE" = success
          python3 tests/e2e/validate_manifest.py evidence --out manifest.json
      - name: Upload the complete manifest
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-complete-manifest
          path: manifest.json
          if-no-files-found: warn
