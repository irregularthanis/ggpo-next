name: Linux compatibility

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request supersedes this run, so cancel it and
# free the runners. Runs on master pushes and manual dispatches always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/classify-changes.yml
    with:
      base: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      force: ${{ github.event_name == 'workflow_dispatch' }}

  sdk:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Each lane builds libGGPO.so and libGGPO.a together and tests both.
    name: Linux ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Check out the tested source
        uses: actions/checkout@v4

      - name: Enable cached container builds
        uses: docker/setup-buildx-action@v3

      - name: Build the shared Linux environment
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/linux/Dockerfile
          load: true
          tags: ggpo-linux-ci:${{ matrix.compiler }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build, test, install and audit the SDK
        run: |
          package_args=()
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            package_args=(--packages)
          fi
          python3 scripts/linux/build_in_container.py \
            --skip-image-build \
            --image ggpo-linux-ci:${{ matrix.compiler }} \
            --compiler ${{ matrix.compiler }} \
            --library both \
            --out build/linux-${{ matrix.compiler }} \
            "${package_args[@]}"

      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.compiler }}
          path: |
            build/linux-${{ matrix.compiler }}/install
            build/linux-${{ matrix.compiler }}/build/Testing
            build/linux-${{ matrix.compiler }}/packages
          if-no-files-found: error

  final-report:
    # One stable required check. Matrix lanes skipped on documentation-only
    # changes never report their expanded names, so the ruleset requires this
    # aggregate instead of the individual lanes.
    name: Complete Linux compatibility
    if: always()
    needs: [changes, sdk]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Linux qualification lane
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          SDK: ${{ needs.sdk.result }}
        run: |
          # A failed classifier must not look like a documentation-only change.
          test "$CHANGES" = success
          if test "$CODE_CHANGED" != true; then
            echo "Documentation-only change: Linux qualification is not required."
            exit 0
          fi
          test "$SDK" = success
