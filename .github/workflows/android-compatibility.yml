name: Android compatibility

# The NDK runs only on x86_64 hosts, so each ABI is built on ubuntu-24.04 and
# its full CTest suite runs on a runner that executes that ABI natively:
# arm64-v8a on ubuntu-24.04-arm, x86_64 on ubuntu-24.04. Test executables are
# linked statically (bionic included), so they run on the runner's Linux
# kernel without an emulator. GitHub checks out to the same path on every
# runner, so the build tree's absolute paths stay valid for ctest.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Android build (${{ matrix.abi }}${{ matrix.config == 'Debug' && ', Debug' || '' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # One Debug build, like the single Windows Debug lane.
        include:
          - {abi: arm64-v8a, config: Release}
          - {abi: armeabi-v7a, config: Release}
          - {abi: x86_64, config: Release}
          - {abi: arm64-v8a, config: Debug}
    steps:
      - uses: actions/checkout@v4
      - name: Cross-compile GGPO and its tests
        run: |
          cat "$ANDROID_NDK_LATEST_HOME/source.properties"
          cmake -S . -B build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=21 \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGPO_BUILD_VECTORWAR=ON \
            -DBUILD_TESTING=ON \
            -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build build/android --parallel 4
          file build/android/bin/*/${{ matrix.config }}/ggpo_android_peer_smoke
      - name: Package the build tree for the test runner
        run: tar -czf android-build.tar.gz build/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ matrix.abi }}-${{ matrix.config }}
          path: android-build.tar.gz
          if-no-files-found: error

  test:
    name: Android tests (${{ matrix.abi }}${{ matrix.config == 'Debug' && ', Debug' || '' }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The arm64 runner also executes 32-bit ARM (EABI5) natively.
          - {abi: arm64-v8a, config: Release, runner: ubuntu-24.04-arm}
          - {abi: armeabi-v7a, config: Release, runner: ubuntu-24.04-arm}
          - {abi: x86_64, config: Release, runner: ubuntu-24.04}
          - {abi: arm64-v8a, config: Debug, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-build-${{ matrix.abi }}-${{ matrix.config }}
      - name: Run the full CTest suite natively
        run: |
          uname -m
          tar -xzf android-build.tar.gz
          ctest --test-dir build/android --output-on-failure --timeout 180
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tests-${{ matrix.abi }}-${{ matrix.config }}
          path: build/android/Testing
          if-no-files-found: warn

  sdk:
    # Both libraries per ABI, installed and audited like the Linux SDK: SONAME,
    # 16 KB alignment, system-only dependencies, frozen exports, API-21
    # ceiling; the public header with the NDK compilers; consumers for every
    # linkage (built and NEEDED-checked; they run in the emulator job).
    name: Android SDK (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {abi: arm64-v8a, triple: aarch64-linux-android}
          - {abi: armeabi-v7a, triple: armv7a-linux-androideabi}
          - {abi: x86_64, triple: x86_64-linux-android}
    env:
      NDK: ${{ github.workspace }}/ndk
    steps:
      - uses: actions/checkout@v4
      - name: Locate the NDK
        run: ln -s "$ANDROID_NDK_LATEST_HOME" "$NDK"
      - name: Build and install both libraries
        run: |
          cmake -S . -B build/sdk -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGPO_BUILD_VECTORWAR=OFF -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/install"
          cmake --build build/sdk --parallel 4
          cmake --install build/sdk
          find build/install -type f -o -type l | sort
      - name: Audit the installed SDK
        run: |
          python3 tests/android/audit_android_sdk.py build/install \
            --ndk "$NDK" --abi ${{ matrix.abi }} --api 21 \
            --manifest tests/baseline/linux/exports.txt \
            --report build/audit.json
      - name: Compile the public header with the NDK compilers
        run: |
          clang="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          "$clang" --target=${{ matrix.triple }}21 -std=c11 -pedantic-errors -Werror \
            -Isrc/include -c tests/consumer/consumer.c -o /tmp/consumer-c.o
          "$clang++" --target=${{ matrix.triple }}21 -std=c++98 -pedantic-errors -Werror \
            -Wno-extern-c-compat -Isrc/include -c tests/consumer/consumer.cpp -o /tmp/consumer-cpp.o
      - name: Build installed consumers for every linkage
        run: |
          python3 tests/consumer/verify_consumers.py --build-only \
            --prefix build/install --work build/consumers --generator Ninja \
            --cmake-arg=-DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            --cmake-arg=-DANDROID_ABI=${{ matrix.abi }} \
            --cmake-arg=-DANDROID_PLATFORM=21 \
            --report build/consumers/consumers.json
      - name: Toolchain isolation (host Linux and Android SDKs reject each other)
        if: matrix.abi == 'arm64-v8a'
        run: |
          set -u
          if cmake -S tests/consumer -B build/neg-host -G Ninja \
               -DGGPO_DIR="$PWD/build/install/lib/cmake/GGPO" > build/neg-host.log 2>&1; then
            cat build/neg-host.log; echo "host Linux project accepted the Android SDK" >&2; exit 1
          fi
          tr -s ' \r\n' '   ' < build/neg-host.log | grep -q "built with android, but the project uses gnu"
          cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGGPO_BUILD_VECTORWAR=OFF -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/host-install" > /dev/null
          cmake --build build/host --parallel 4 > /dev/null
          cmake --install build/host > /dev/null
          if cmake -S tests/consumer -B build/neg-android -G Ninja \
               -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
               -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=21 \
               -DGGPO_DIR="$PWD/build/host-install/lib/cmake/GGPO" > build/neg-android.log 2>&1; then
            cat build/neg-android.log; echo "Android project accepted the host Linux SDK" >&2; exit 1
          fi
          tr -s ' \r\n' '   ' < build/neg-android.log | grep -q "built with gnu, but the project uses android"
          echo "Both directions rejected with the toolchain message"
      - name: Upload the installed SDK and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-sdk-${{ matrix.abi }}
          path: |
            build/install
            build/audit.json
            build/consumers/consumers.json
          if-no-files-found: warn

  emulator:
    # Full Android system: tests link the shared libGGPO.so and run inside the
    # emulator through tests/android/run_on_device.py, on the oldest supported
    # API (21) and a current one. x86_64 because hosted arm64 runners have no KVM.
    name: Android emulator (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 21, target: default}
          - {api: 35, target: google_apis}
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cross-compile both libraries and the tests (x86_64)
        run: |
          cmake -S . -B build/emu -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGPO_BUILD_VECTORWAR=ON \
            -DBUILD_TESTING=ON \
            "-DCMAKE_CROSSCOMPILING_EMULATOR=python3;$GITHUB_WORKSPACE/tests/android/run_on_device.py"
          cmake --build build/emu --parallel 4
          ls build/emu/bin/*/Release/*.so
      - name: Run the full CTest suite in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GGPO_TEST_LAUNCHER: ${{ github.workspace }}/tests/android/run_on_device.py
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: adb shell getprop ro.build.version.sdk && ctest --test-dir build/emu --output-on-failure --timeout 300 && cmake --install build/emu --prefix build/emu-install && python3 tests/consumer/verify_consumers.py --prefix build/emu-install --work build/emu-consumers --generator Ninja --cmake-arg=-DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake --cmake-arg=-DANDROID_ABI=x86_64 --cmake-arg=-DANDROID_PLATFORM=21
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-api${{ matrix.api }}
          path: build/emu/Testing
          if-no-files-found: warn

  vectorwar-apk:
    # The SDL2 frontend as an APK: Gradle drives the repository's CMake build.
    name: Vector War APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Fetch SDL2 sources
        run: |
          curl -sSL https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "SDL2_SOURCE_DIR=$RUNNER_TEMP/SDL2-2.30.9" >> "$GITHUB_ENV"
      - name: Build the APK
        run: |
          gradle -p src/apps/vectorwar/android assembleDebug --no-daemon
          apk=src/apps/vectorwar/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep -E "lib/.*\.so$"
      - uses: actions/upload-artifact@v4
        with:
          name: vectorwar-apk
          path: src/apps/vectorwar/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  vectorwar-apk-smoke:
    name: Vector War APK smoke (API ${{ matrix.api }})
    needs: vectorwar-apk
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 21, target: default}
          - {api: 35, target: google_apis}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vectorwar-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and start the APK in smoke mode
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: sh tests/android/apk_smoke.sh app-debug.apk
