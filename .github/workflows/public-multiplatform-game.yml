name: Public multi-platform game

# One real Vector War match joins Linux, Windows/MSVC, Android and macOS through the
# DuckDNS production name. Forced relay makes the deployed OCI data path part
# of the contract; deterministic namespace tests cover direct NAT traversal.
on:
  workflow_call:
    inputs:
      mode:
        description: "optional skips before launch when no server exists; required fails"
        type: string
        default: optional
      server:
        description: "Public matchmaking endpoint; empty uses the DuckDNS repository variable"
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      mode:
        description: "Server availability policy"
        type: choice
        options: [optional, required]
        default: optional
      server:
        description: "HOST:PORT; empty uses DUCKDNS_SUBDOMAIN:7100"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: public-multiplatform-game
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve DDNS and probe the public lobby
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.probe.outputs.run }}
      lobby: ${{ steps.lobby.outputs.value }}
      server: ${{ steps.server.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select the public endpoint
        id: server
        env:
          REQUESTED: ${{ inputs.server }}
          SUBDOMAIN: ${{ vars.DUCKDNS_SUBDOMAIN }}
        run: |
          server="$REQUESTED"
          if test -z "$server"; then server="$SUBDOMAIN.duckdns.org:7100"; fi
          test -n "$SUBDOMAIN" || test -n "$REQUESTED"
          echo "value=$server" >> "$GITHUB_OUTPUT"
      - name: Derive a run-scoped lobby code
        id: lobby
        run: |
          value=$(printf '%s' "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" | sha256sum | cut -c1-8 | tr 'a-f' 'A-F')
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Probe DNS and the lobby protocol
        id: probe
        env:
          SERVER: ${{ steps.server.outputs.value }}
        run: python tests/e2e/public_multiplatform_game.py probe --server "$SERVER" --mode "${{ inputs.mode }}"

  build-linux:
    name: Build Linux Vector War peer
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the native static headless peer
        run: |
          cmake -S . -B build/public-game -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGPO_BUILD_VECTORWAR_GUI=OFF
          cmake --build build/public-game --target VectorWarHeadless --parallel 2
          install -D -m 0755 build/public-game/bin/x64/Release/VectorWarHeadless \
            artifact/vectorwar_headless
      - uses: actions/upload-artifact@v4
        with:
          name: public-game-binary-linux
          path: artifact
          if-no-files-found: error

  build-windows:
    name: Build Windows MSVC Vector War peer
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build the native static headless peer
        shell: pwsh
        run: |
          cmake -S . -B build/public-game -A x64 `
            -DBUILD_SHARED_LIBS=OFF -DGGPO_BUILD_VECTORWAR_GUI=OFF
          cmake --build build/public-game --config Release `
            --target VectorWarHeadless --parallel 2
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build/public-game/bin/x64/Release/VectorWarHeadless.exe `
            artifact/vectorwar_headless.exe
      - uses: actions/upload-artifact@v4
        with:
          name: public-game-binary-windows
          path: artifact
          if-no-files-found: error

  build-android:
    name: Build Android Vector War peer
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # x86_64 so the peer runs on a real Android system image (the emulator).
      # Dynamically linked against bionic: name resolution goes through
      # Android's resolver client, which libc loads at run time; a fully
      # static executable cannot load it and fails to resolve any hostname,
      # even on Android. GGPO itself stays statically linked into the peer.
      - name: Build the x86_64 Android peer
        run: |
          cmake -S . -B build/public-game -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=21 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGPO_BUILD_VECTORWAR=ON -DGGPO_BUILD_VECTORWAR_GUI=OFF
          cmake --build build/public-game --target VectorWarHeadless --parallel 2
          # Must need only Android system libraries (no libGGPO.so to push).
          "$ANDROID_NDK_LATEST_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -d \
            build/public-game/bin/*/Release/VectorWarHeadless | tee /dev/stderr \
            | grep NEEDED | grep -vE '\[(libc|libm|libdl|liblog)\.so\]' && exit 1 || true
          install -D -m 0755 build/public-game/bin/*/Release/VectorWarHeadless \
            artifact/vectorwar_headless
      - uses: actions/upload-artifact@v4
        with:
          name: public-game-binary-android
          path: artifact
          if-no-files-found: error

  build-macos:
    name: Build macOS Vector War peer
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build the native static headless peer (universal, macOS 11)
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          cmake -S . -B build/public-game \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DGGPO_BUILD_VECTORWAR_GUI=OFF -DGGPO_RUN_TESTS_ON_BUILD=OFF
          cmake --build build/public-game --target VectorWarHeadless --parallel 3
          mkdir -p artifact
          install -m 0755 build/public-game/bin/x64/Release/VectorWarHeadless \
            artifact/vectorwar_headless
      - uses: actions/upload-artifact@v4
        with:
          name: public-game-binary-macos
          path: artifact
          if-no-files-found: error

  play:
    name: Play as ${{ matrix.platform }}
    needs: [preflight, build-linux, build-windows, build-android, build-macos]
    if: needs.preflight.outputs.run == 'true'
    # The Android role also boots an emulator.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, os: ubuntu-24.04, executable: peer/vectorwar_headless}
          - {platform: windows, os: windows-2022, executable: peer/vectorwar_headless.exe}
          - {platform: android, os: ubuntu-24.04, executable: peer/vectorwar_headless}
          - {platform: macos, os: macos-15, executable: peer/vectorwar_headless}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: public-game-binary-${{ matrix.platform }}
          path: peer
      - name: Make the Unix peer executable
        if: runner.os != 'Windows'
        run: chmod 0755 peer/vectorwar_headless
      - name: Join the public multi-platform match
        if: matrix.platform != 'android'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python tests/e2e/public_multiplatform_game.py role \
            --server "${{ needs.preflight.outputs.server }}" \
            --lobby "${{ needs.preflight.outputs.lobby }}" \
            --platform "${{ matrix.platform }}" \
            --executable "${{ matrix.executable }}" \
            --output "evidence/${{ matrix.platform }}"
      - name: Enable KVM
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Join the public multi-platform match on the Android emulator
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The harness runs the peer on the emulator through adb.
          GGPO_TEST_LAUNCHER: ${{ github.workspace }}/tests/android/run_on_device.py
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          # The emulator copies the host's DNS servers, and on Ubuntu runners
          # that is systemd-resolved's 127.0.0.53, which is unreachable from
          # inside Android; give it real resolvers.
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -dns-server 1.1.1.1,8.8.8.8
          # Fail fast, before the other platforms wait, if Android cannot
          # resolve the server name. ping prints "PING host (ip)" once the name
          # resolves, whether or not ICMP replies get through the emulator.
          # Android reports boot complete before its network is up, so retry
          # for up to two minutes. The action runs each line through its own
          # sh -c, so the loop stays on one line. On failure, a well-known
          # name shows whether DNS works at all.
          script: |
            host=$(echo '${{ needs.preflight.outputs.server }}' | cut -d: -f1); for i in $(seq 1 24); do adb shell "ping -c 1 -W 2 $host" > android-dns.txt 2>&1; if grep -q '^PING ' android-dns.txt; then break; fi; sleep 5; done; cat android-dns.txt
            grep -q '^PING ' android-dns.txt || { adb shell "ping -c 1 -W 2 dns.google; getprop | grep -i dns; ip addr" || true; exit 1; }
            python tests/e2e/public_multiplatform_game.py role --server "${{ needs.preflight.outputs.server }}" --lobby "${{ needs.preflight.outputs.lobby }}" --platform android --executable "${{ matrix.executable }}" --output evidence/android
      - name: Upload peer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-game-${{ matrix.platform }}
          path: evidence
          if-no-files-found: warn

  final-report:
    name: Complete public multi-platform game
    if: always()
    needs: [preflight, build-linux, build-windows, build-android, build-macos, play]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Remove this run's rendezvous deployments
        # Also runs when the workflow is cancelled, so a superseded run's
        # role jobs cannot leave "in progress" deployments behind.
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tests/e2e/rendezvous_cleanup.py
      - name: Report an optional preflight skip
        if: needs.preflight.result == 'success' && needs.preflight.outputs.run != 'true'
        run: |
          echo "### Public multi-platform game skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "The public server was not available before the match started." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        if: needs.preflight.outputs.run == 'true'
        with:
          pattern: public-game-*
          path: evidence
      - name: Validate all four peers and publish the manifest
        if: needs.preflight.outputs.run == 'true'
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          BUILD_LINUX: ${{ needs.build-linux.result }}
          BUILD_WINDOWS: ${{ needs.build-windows.result }}
          BUILD_ANDROID: ${{ needs.build-android.result }}
          BUILD_MACOS: ${{ needs.build-macos.result }}
          PLAY: ${{ needs.play.result }}
        run: |
          test "$PREFLIGHT" = success
          test "$BUILD_LINUX" = success
          test "$BUILD_WINDOWS" = success
          test "$BUILD_ANDROID" = success
          test "$BUILD_MACOS" = success
          test "$PLAY" = success
          python tests/e2e/public_multiplatform_game.py validate \
            --evidence evidence --output public-game-manifest.json
          {
            echo "### Public multi-platform game passed"
            echo ""
            echo "Linux, Windows/MSVC, Android and macOS converged through the deployed relay."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail a required or otherwise broken preflight
        if: needs.preflight.result != 'success'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always() && needs.preflight.outputs.run == 'true'
        with:
          name: public-game-complete-manifest
          path: public-game-manifest.json
          if-no-files-found: warn
