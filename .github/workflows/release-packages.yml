name: Package release SDK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package-linux:
    name: Linux x86-64 ${{ matrix.library }} SDK
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        library: [shared, static]

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
      - name: Verify tag and project versions agree
        shell: bash
        run: |
          version=$(sed -n 's/^project(GGPO VERSION \([0-9][0-9.]*\)).*/\1/p' CMakeLists.txt)
          expected="v${version}"
          rc_prefix="${expected}-rc."
          rc_number="${GITHUB_REF_NAME#"${rc_prefix}"}"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" &&
                !( "${GITHUB_REF_NAME}" == "${rc_prefix}"* && "${rc_number}" =~ ^[0-9]+$ ) ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match ${expected} or ${expected}-rc.N" >&2
            exit 1
          fi
      - name: Enable cached container builds
        uses: docker/setup-buildx-action@v3
      - name: Build the shared Linux environment
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/linux/Dockerfile
          load: true
          tags: ggpo-linux-release:${{ matrix.library }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build, test, install and audit the SDK
        run: |
          python3 scripts/linux/build_in_container.py \
            --skip-image-build \
            --image ggpo-linux-release:${{ matrix.library }} \
            --compiler gcc \
            --library ${{ matrix.library }} \
            --out build/linux-${{ matrix.library }} \
            --packages
      - name: Upload packaged SDK
        uses: actions/upload-artifact@v4
        with:
          name: release-package-linux-x86_64-${{ matrix.library }}
          path: build/linux-${{ matrix.library }}/packages/ggpo-*
          if-no-files-found: error

  package-windows:
    name: Windows ${{ matrix.label }} SDK
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            platform: x64
            shared: "ON"
            linkage: shared
            label: x64 shared
          - architecture: x64
            platform: x64
            shared: "OFF"
            linkage: static
            label: x64 static
          - architecture: Win32
            platform: x86
            shared: "ON"
            linkage: shared
            label: x86 shared
          - architecture: Win32
            platform: x86
            shared: "OFF"
            linkage: static
            label: x86 static

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Verify tag and project versions agree
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $text = Get-Content CMakeLists.txt -Raw
          if ($text -notmatch 'project\(GGPO VERSION ([0-9]+\.[0-9]+\.[0-9]+)\)') {
            throw "Could not read the GGPO project version"
          }
          $expectedTag = "v$($Matches[1])"
          $actualTag = "${{ github.ref_name }}"
          $releaseCandidate = "^$([regex]::Escape($expectedTag))-rc\.[0-9]+$"
          if ($actualTag -ne $expectedTag -and $actualTag -notmatch $releaseCandidate) {
            throw "Release tag $actualTag does not match $expectedTag or $expectedTag-rc.N"
          }

      - name: Configure the SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B build/package `
            -G "Visual Studio 17 2022" `
            -A "${{ matrix.architecture }}" `
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} `
            -DGGPO_BUILD_SDK=ON `
            -DGGPO_BUILD_VECTORWAR=OFF `
            -DGGPO_RUN_TESTS_ON_BUILD=OFF `
            -DBUILD_TESTING=ON

      - name: Build and test the SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build build/package --config Release --parallel
          ctest --test-dir build/package -C Release --output-on-failure

      - name: Install and archive the SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $version = "${{ github.ref_name }}".Substring(1)
          $name = "ggpo-$version-windows-${{ matrix.platform }}-${{ matrix.linkage }}"
          $stage = Join-Path $PWD "build/stage/$name"
          cmake --install build/package --config Release --prefix $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "build/$name.zip"

      - name: Validate the extracted release archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $version = "${{ github.ref_name }}".Substring(1)
          $name = "ggpo-$version-windows-${{ matrix.platform }}-${{ matrix.linkage }}"
          $extract = Join-Path $PWD "build/extracted/$name"
          Expand-Archive "build/$name.zip" -DestinationPath $extract
          cmake -S tests/consumer -B build/release-consumer `
            -G "Visual Studio 17 2022" `
            -A "${{ matrix.architecture }}" `
            "-DCMAKE_PREFIX_PATH=$($extract.Replace('\', '/'))"
          cmake --build build/release-consumer --config Release --parallel
          $env:PATH = "$(Join-Path $extract bin);$env:PATH"
          & (Join-Path $PWD "build/release-consumer/Release/ggpo_installed_c11.exe")
          if ($LASTEXITCODE -ne 0) { throw "Extracted C11 consumer failed" }
          & (Join-Path $PWD "build/release-consumer/Release/ggpo_installed_cpp98.exe")
          if ($LASTEXITCODE -ne 0) { throw "Extracted C++98 consumer failed" }

      - name: Upload packaged SDK
        uses: actions/upload-artifact@v4
        with:
          name: release-package-windows-${{ matrix.platform }}-${{ matrix.linkage }}
          path: build/ggpo-*.zip
          if-no-files-found: error

  package-vectorwar-linux:
    name: Linux x86-64 Vector War
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
      - name: Build the repository Linux environment
        run: docker build -f docker/linux/Dockerfile -t ggpo-vectorwar-release .
      - name: Build and smoke-test the interactive app
        run: |
          mkdir -p build/vectorwar-linux
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e SDL_VIDEODRIVER=dummy \
            -v "$PWD:/src:ro" -v "$PWD/build/vectorwar-linux:/out" \
            -w /src ggpo-vectorwar-release sh -euxc '
              cmake -S /src -B /out/build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
                -DGGPO_BUILD_SDK=ON -DGGPO_BUILD_VECTORWAR=ON \
                -DGGPO_RUN_TESTS_ON_BUILD=OFF -DBUILD_TESTING=ON
              cmake --build /out/build --target VectorWar --parallel 2
              /out/build/bin/x64/Release/VectorWar --frontend-smoke
            '
      - name: Archive the standalone app
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="ggpo-${version}-vectorwar-linux-x86_64"
          mkdir -p "build/stage/$name"
          install -m 0755 build/vectorwar-linux/build/bin/x64/Release/VectorWar \
            "build/stage/$name/vectorwar"
          install -m 0644 LICENSE doc/architecture/VectorWar.md "build/stage/$name/"
          tar -C build/stage -czf "build/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: release-package-vectorwar-linux-x86_64
          path: build/ggpo-*-vectorwar-linux-x86_64.tar.gz
          if-no-files-found: error

  package-vectorwar-windows:
    name: Windows ${{ matrix.platform }} Vector War
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - {architecture: x64, platform: x64}
          - {architecture: Win32, platform: x86}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
      - name: Build the standalone app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B build/vectorwar -A "${{ matrix.architecture }}" `
            -DBUILD_SHARED_LIBS=OFF -DGGPO_BUILD_SDK=ON `
            -DGGPO_BUILD_VECTORWAR=ON -DGGPO_RUN_TESTS_ON_BUILD=OFF `
            -DBUILD_TESTING=ON
          cmake --build build/vectorwar --config Release `
            --target VectorWar --parallel 2
      - name: Archive the standalone app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ github.ref_name }}".Substring(1)
          $name = "ggpo-$version-vectorwar-windows-${{ matrix.platform }}"
          $stage = Join-Path $PWD "build/stage/$name"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "build/vectorwar/bin/${{ matrix.platform }}/Release/VectorWar.exe" $stage
          Copy-Item LICENSE, doc/architecture/VectorWar.md $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "build/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-package-vectorwar-windows-${{ matrix.platform }}
          path: build/ggpo-*-vectorwar-windows-${{ matrix.platform }}.zip
          if-no-files-found: error

  publish-release:
    name: Publish release assets
    needs: [package-windows, package-linux, package-vectorwar-linux, package-vectorwar-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Collect packaged SDK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-package-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum ggpo-*.zip ggpo-*.tar.gz ggpo-*.deb ggpo-*.rpm > SHA256SUMS

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease_args=()
            if [[ "$TAG" == *-rc.* ]]; then
              prerelease_args=(--prerelease)
            fi
            gh release create "$TAG" --verify-tag --generate-notes --title "GGPO $TAG" "${prerelease_args[@]}"
          fi
          gh release upload "$TAG" release-assets/ggpo-*.zip release-assets/ggpo-*.tar.gz release-assets/ggpo-*.deb release-assets/ggpo-*.rpm release-assets/SHA256SUMS --clobber
