# GGPO AppVeyor CI Configuration

version: 2.4.3.{build}

image: Visual Studio 2019

environment:
  matrix:
    - GGPO_SHARED_LIB: on
    - GGPO_SHARED_LIB: off

matrix:
  fast_finish: true

skip_commits:
  files:
    - doc/*

configuration:
  - Debug
  - Release
platform:
  - x64

before_build:
  - configure_windows.cmd --no-prompt

build:
  project: build\GGPO.sln

test_script:
  - ctest --test-dir build -C %CONFIGURATION% --output-on-failure

after_test:
  - ps: >-
      ./scripts/ci/capture_windows_m0.ps1
      -BuildDirectory build
      -Configuration $env:CONFIGURATION
      -Architecture x64
      -Shared $(if ($env:GGPO_SHARED_LIB -eq 'on') { 'ON' } else { 'OFF' })
      -OutputDirectory "build/m0-evidence/x64-$env:GGPO_SHARED_LIB-$env:CONFIGURATION"
      -NoiseRuns 0

artifacts:
  - path: build\m0-evidence\**\*
    name: m0-evidence
